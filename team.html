<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://github.com/An0jin/WarmCoolUnity/blob/main/Assets/img/icon.png?raw=true">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toneiverse - 팀원 소개</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="antialiased">

    <main class="flex-grow container mx-auto px-6 py-12">

        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-jua text-[#E86A50] mb-4">
                Toneiverse 개발 팀원
            </h1>
            <p class="text-lg text-gray-600 font-medium break-keep">
                나만의 톤을 찾아주는 Toneiverse를 만들어가는<br>
                팀원들의 이력과 역량을 소개합니다.
            </p>
        </div>

        <div id="team-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8">
        </div>

    </main>

    <footer class="bg-[#F7EFE5] border-t border-[#F29479] py-8 mt-12">
        <div class="container mx-auto px-6 text-center text-gray-500 font-bold">
            &copy; 2025 Toneiverse. AI 소셜 뷰티 앱.
        </div>
    </footer>

    <script>
        // --- DATA SECTION: tenure 값을 'YYYY.MM.DD' 형식으로 입력하세요 ---
        const teamMembers = [
            {
                id: 1,
                // role: "Project Manager & Backend & AI Data Analyst & AR Frontend",
                name: "안영진",
                education: "경복대학교 빅데이터학과",
                tasks: [
                    "Custom 데이터셋 수집 (Roboflow)",
                    "FastAPI 기반 AI 백엔드 개발 및 PostgreSQL DB 구축",
                    "Unity AR Foundation을 활용한 AR 프론트엔드 개발",
                    "객체 탐지 모델인 YOLOv26과 AR 시스템 간 연동",
                    "Oracle Cloud 기반의 Docker 컨테이너 서버 운영",
                    "Nginx Proxy Manager를 활용한 HTTPS 보안 서버 구축",
                    "OpenCV를 활용한 이미지 데이터 크롭",
                ],
                tech: [
                    "Windows", "Xubuntu", "Oracle Linux", "C#", "python",
                    "Ultralytics (YOLOv26)",
                    "Gemini API", "FastAPI", "Postgresql", "pandas",
                    "oracle cloud", "docker", "Unity", "AR Foundation",
                    "photon engine", "Roboflow", "OpenCV",
                    "Let's Encrypt", "nginx proxy manager"
                ],
                tenure: ["2025.03.01~"]
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const teamGrid = document.getElementById('team-grid');

            teamMembers.forEach(member => {
                // Tech Stack Tags
                const techHtml = member.tech.map(t =>
                    `<span class="px-2 py-1 bg-[#F7EFE5] text-[#E86A50] text-xs font-bold rounded-full border border-[#F29479]">${t}</span>`
                ).join('');

                // Task List
                const tasksHtml = member.tasks.map(t =>
                    `<li class="flex items-start text-sm text-gray-600 mb-1">
                        <span class="mr-2 text-[#F29479]">✔</span> ${t}
                    </li>`
                ).join('');

                // Tenure List
                const tenureHtml = member.tenure.map(t =>
                    `<li class="text-sm text-gray-600 mb-1">${t}</li>`
                ).join('');

                // Card Layout - Tenure Format Updated
                const cardHtml = `
                    <div class="card-kitsch p-8 flex flex-col relative overflow-hidden group">
                        
                        <div class="absolute top-0 left-0 w-full h-2 bg-[#F29479]"></div>
                        
                        <div class="mb-6 border-b border-dashed border-[#F29479] pb-4">
                            <h3 class="text-3xl font-jua text-gray-800 mb-1">${member.name}</h3>
                            <!-- <p class="text-[#F29479] font-bold text-base">${member.role}</p> -->
                        </div>

                        <div class="w-full space-y-5">
                            
                            <div class="text-left w-full">
                                <h4 class="font-jua text-[#E86A50] text-sm mb-1">📅 재직 기간</h4>
                                <ul class="pl-1">
                                    ${tenureHtml}
                                </ul>
                            </div>

                            <div class="text-left w-full">
                                <h4 class="font-jua text-[#E86A50] text-sm mb-1">🎓 학력</h4>
                                <p class="text-sm text-gray-600">
                                    ${member.education}
                                </p>
                            </div>

                            <div class="text-left w-full">
                                <h4 class="font-jua text-[#E86A50] text-sm mb-1">⚡ 담당 업무</h4>
                                <ul class="pl-1">
                                    ${tasksHtml}
                                </ul>
                            </div>

                            <div class="text-left w-full">
                                <h4 class="font-jua text-[#E86A50] text-sm mb-2">🛠 사용 기술</h4>
                                <div class="flex flex-wrap gap-2">
                                    ${techHtml}
                                </div>
                            </div>

                        </div>
                    </div>
                `;

                teamGrid.innerHTML += cardHtml;
            });

            setTimeout(() => {
                document.querySelectorAll('.tenure-bar').forEach(bar => {
                    bar.style.width = bar.getAttribute('data-width');
                });
            }, 100);
        });
    </script>
    <script src="navbar.js"></script>
</body>

</html>
